<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flood resilience analysis</title>
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--ground:#F4F5F1;--panel:#FCFCFB;--ink:#16201F;--muted:#5B6664;--rule:#DCE0DA;--grid:#E9ECE7;--focus:#2A78D6;--ns:#D9DCD6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#141817;--panel:#1B1F1E;--ink:#ECEFEC;--muted:#A3ADAA;--rule:#2F3634;--grid:#252B29;--focus:#86B6EF;--ns:#3A403E}}
:root[data-theme="dark"]{--ground:#141817;--panel:#1B1F1E;--ink:#ECEFEC;--muted:#A3ADAA;--rule:#2F3634;--grid:#252B29;--focus:#86B6EF;--ns:#3A403E}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
main{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 6px;max-width:75ch}
nav a,button.theme{font:inherit;font-size:13px;color:var(--ink);border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:6px 12px;text-decoration:none;cursor:pointer}
section{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;margin-top:22px}
h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:85ch}
table{border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:7px 12px;border-top:1px solid var(--rule);text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;color:var(--muted);font-weight:600;font-size:12px}
td.us{font-weight:600}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mapcard h3{font-size:13px;margin:0 0 2px;font-weight:600}
.mapcard p{margin:0 0 6px;color:var(--muted);font-size:11.5px}
.mapcard svg{width:100%;height:auto;display:block}
.leg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:4px}
.leg .ramp{height:8px;flex:1;border-radius:2px}
.leg .ns{width:14px;height:8px;background:var(--ns);border-radius:2px}
.scroll{overflow-x:auto}
.note{background:color-mix(in srgb,var(--focus) 8%,transparent);border-left:3px solid var(--focus);padding:10px 14px;font-size:13px;margin-top:14px;max-width:95ch}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none;z-index:5}
#splom{display:block}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Flood resilience analysis</h1>
      <p class="lede" id="lede"></p>
    </div>
    <nav style="display:flex;gap:8px"><a href="../">← Back to the map</a><button class="theme" id="theme"></button></nav>
  </header>

  <div id="models"></div>

  <section>
    <h2>Correlation between the indices (Lama &amp; Sun Fig. 7, plus SEIFA)</h2>
    <p class="sub" id="f7sub"></p>
    <div class="scroll"><div id="splomwrap" style="position:relative"></div></div>
  </section>
</main>
<div class="tip" id="tip"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
// Analysis page: for each model in D.stats (paper study area on SA1s, Greater Melbourne on SA2s),
// Lama & Sun Table 5 + bandwidth/VIF table + Fig. 4 maps; then Fig. 7 scatter matrix of the six
// indices (D.sa1[].ls) plus SEIFA. See docs/ARCHITECTURE.md §2.7.
const D=JSON.parse(document.getElementById('data').textContent),S=D.sa1,META=D.meta,ST=D.stats;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const DARK=css('--ground').toLowerCase()==='#141817';
const tb=document.getElementById('theme');tb.textContent=DARK?'☀ Light mode':'☾ Dark mode';
tb.onclick=()=>{try{localStorage.setItem('theme',DARK?'light':'dark');}catch(e){}location.reload();};
document.getElementById('lede').textContent=`${META.title} · ${META.n.toLocaleString()} SA1s · reproducing the statistical analysis of Lama & Sun (2026), Urban Informatics 5:25, with public data substitutes.`;
const DIV=['#a92a2a','#e34948','#f29a99',DARK?'#3a3f3d':'#eceae6','#86b6ef','#3987e5','#1c5cab'];
const divScale=m=>d3.scaleQuantize().domain([-m,m]).range(DIV);
const tip=document.getElementById('tip');
const showTip=(e,h)=>{tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';tip.innerHTML=h;};
const hideTip=()=>tip.style.display='none';

// ---------- Table 5 and Fig. 4, once per model
// D.stats is a list of models (older builds: one object or null). Each has the lamasun_stats.run()
// fields plus title, unit ('SA1' | 'SA2') and either idx (SA1 indices it covers) or units (SA2 shapes).
const MODELS=Array.isArray(ST)?ST:ST?[ST]:[];
if(!MODELS.length)d3.select('#models').append('section').html('<h2>GWR and MGWR (Lama &amp; Sun Table 5, Fig. 4)</h2><p class="sub">No regression model was fitted for this build; see the notes on the map page.</p>');
MODELS.forEach((M,mi)=>{
  const U=M.unit||'SA1', nU=M.coef.length, idx=M.idx||d3.range(nU);
  const T=d3.select('#models').append('section');
  T.append('h2').text(`Model fit: GWR vs MGWR (Lama & Sun Table 5) · ${M.title||META.title}`);
  T.append('p').attr('class','sub').text(`${nU.toLocaleString()} ${U}s. Response: ${M.y}. Explanatory: ${M.vars.slice(1).join(', ')}. All standardised; adaptive bisquare kernel; bandwidths chosen by AICc (golden section).`
    +(M.paper_units?' These are the paper\'s own units, so this table is the direct comparison with Lama & Sun.':U==='SA2'?' Fitted on SA2s because MGWR\'s cost grows with the square of the number of units.':''));
  const p=M.paper,rows=[['R²','R2'],['Adjusted R²','adjR2'],['AICc','AICc'],[`Bandwidth (nearest ${U}s)`,'bw']];
  T.append('div').attr('class','scroll').append('table').html(`<thead><tr><th>Statistic</th><th>GWR, this build</th><th>MGWR, this build</th><th>GWR, paper</th><th>MGWR, paper</th></tr></thead><tbody>${rows.map(([l,k])=>`<tr><td>${l}</td><td class="us">${M.gwr[k]??'–'}</td><td class="us">${!M.mgwr.ok?(k==='R2'?'did not converge':'–'):k==='bw'?'per variable ↓':M.mgwr[k]}</td><td>${p.gwr[k]??'–'}</td><td>${k==='bw'?'not reported':p.mgwr[k]??'–'}</td></tr>`).join('')}</tbody>`);
  const cm=M.coef_model;
  T.append('h2').style('margin-top','20px').text(cm==='MGWR'?'MGWR bandwidth and significance by variable':'GWR coefficients and significance by variable (MGWR did not converge)');
  T.append('p').attr('class','sub').text(`Bandwidth is the number of nearest ${U}s each local regression uses: small means the relationship varies locally, large means it's close to global. "Significant" uses multiple-testing-corrected t-values. VIF (variance inflation factor) above 10, in red, means the variable is almost a linear combination of the others, so its coefficient is unstable and shouldn't be read on its own. The paper uses counts (population, employed, educated, income earners), which all grow with unit size.`);
  T.append('div').attr('class','scroll').append('table').html(`<thead><tr><th>Variable</th><th>Bandwidth</th><th>Share of ${U}s significant</th><th>Mean coefficient</th><th>Range</th><th>VIF</th></tr></thead><tbody>${M.vars.map((v,j)=>{const c=M.coef.map(r=>r[j]),sig=M.sig.filter(r=>r[j]).length;
    return `<tr><td>${v}</td><td>${cm==='MGWR'?M.mgwr.bws[j]:M.gwr_bw}</td><td>${(sig/nU*100).toFixed(0)}%</td><td>${d3.mean(c).toFixed(3)}</td><td>${d3.min(c).toFixed(2)} to ${d3.max(c).toFixed(2)}</td><td style="${M.vif&&M.vif[j]>10?'color:#e34948;font-weight:600':''}">${M.vif&&M.vif[j]!=null?M.vif[j]:'–'}</td></tr>`;}).join('')}</tbody>`);
  T.append('div').attr('class','note').html(`<strong>Read with care.</strong> The paper regresses HEC-RAS flood <em>depth</em>; this build uses the share of residents inside planning overlays, placed by address points, which is zero for most units, so the fit statistics are not comparable with the paper's. The paper is also inconsistent about the response (section 2.2.3 says flood depth; section 3.2 says IFRI): this follows 2.2.3, which matches Fig. 4's ten coefficient maps.${M.dropped.length?' Dropped for lack of data: '+M.dropped.join(', ')+'.':''}${M.unstable&&M.unstable.length?` <strong>Dropped as locally constant:</strong> ${M.unstable.join(', ')}. Inside each neighbourhood it barely varies, so it is collinear with the local intercept and both coefficients blew up; the model is refitted without it.`:''} Local R² comes from the ${M.localR2_model} model.${M.mgwr.ok?'':` <strong>MGWR did not converge</strong> even with bandwidths floored at ${M.mgwr.bw_min} ${U}s, so the maps and the table show GWR (one bandwidth, ${M.gwr_bw} ${U}s).`} MGWR bandwidths are floored at ${M.mgwr.bw_min} ${U}s because local fits on very few neighbours are singular.${U==='SA2'?' <strong>Unit of analysis:</strong> SA1 counts are summed, the flood share is resident-weighted and elevation, sand and land use are area-weighted. SA2-scale coefficients can differ from SA1-scale ones (the modifiable areal unit problem).':''}`);

  // Fig. 4 small multiples
  const F=d3.select('#models').append('section');
  F.append('h2').text(`Local R² and ${cm} coefficients (Lama & Sun Fig. 4) · ${M.title||META.title}`);
  F.append('p').attr('class','sub').text(`One map per variable. Coefficients are on standardised variables, so they are comparable across maps. Blue raises the (proxy) flood exposure, red lowers it; grey means not significant at that ${U}.`);
  const grid=F.append('div').attr('class','grid4');
  const G=U==='SA1'?idx.map(i=>D.shapes[i]):M.units.map(u=>u.g);
  const NM=i=>U==='SA1'?`<strong>${S[idx[i]].sub}</strong><br>SA1 ${S[idx[i]].id}`:`<strong>${M.units[i].name}</strong><br>SA2`;
  const fc={type:'FeatureCollection',features:G.map((g,i)=>({type:'Feature',geometry:g,properties:{i}}))};
  const X=d3.range(G.length);
  const W=260,H=300,proj=d3.geoMercator().fitSize([W,H],fc),path=d3.geoPath(proj);
  const panels=[{t:'Local R²',p:`Model fit at each ${U} (${M.localR2_model})`,v:i=>M.localR2[i],seq:true}]
    .concat(M.vars.map((v,j)=>({t:v,p:`${cm} bandwidth ${cm==='MGWR'?M.mgwr.bws[j]:M.gwr_bw}`,v:i=>M.coef[i][j],sig:i=>M.sig[i][j],j})));
  panels.forEach(pn=>{
    const card=grid.append('div').attr('class','mapcard');
    card.append('h3').text(pn.t);card.append('p').text(pn.p);
    const svg=card.append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('role','img').attr('aria-label',pn.t+' map');
    let col,leg;
    if(pn.seq){const sc=d3.scaleSequential(d3.interpolateRgbBasis(['#d2f1e6','#3fb68d','#0b4d38'])).domain(d3.extent(X,i=>pn.v(i)));col=i=>sc(pn.v(i));
      leg=`<span>${d3.min(X,i=>pn.v(i)).toFixed(2)}</span><div class="ramp" style="background:linear-gradient(90deg,#d2f1e6,#3fb68d,#0b4d38)"></div><span>${d3.max(X,i=>pn.v(i)).toFixed(2)}</span>`;}
    else{const m=d3.max(X,i=>Math.abs(pn.v(i)))||1,sc=divScale(m);col=i=>pn.sig(i)?sc(pn.v(i)):css('--ns');
      leg=`<span>−${m.toFixed(2)}</span><div class="ramp" style="background:linear-gradient(90deg,${DIV.join(',')})"></div><span>+${m.toFixed(2)}</span><span class="ns"></span><span>n.s.</span>`;}
    svg.selectAll('path').data(fc.features).join('path').attr('d',path).attr('fill',d=>col(d.properties.i)).attr('stroke',css('--panel')).attr('stroke-width',.25)
      .on('mousemove',(e,d)=>{const i=d.properties.i;showTip(e,`${NM(i)}<br>${pn.t}: ${pn.v(i).toFixed(3)}${pn.sig&&!pn.sig(i)?' (not significant)':''}`);}).on('mouseleave',hideTip);
    card.append('div').attr('class','leg').html(leg);
  });
});

// ---------- Fig. 7 scatter matrix
// SEIFA IRSD decile (1 = most disadvantaged) is added as a 7th variable when the build has it,
// to show how the paper's indices line up with socio-economic disadvantage.
const HAS_SEIFA=S.some(s=>s.seifa&&s.seifa[0]!=null);
const NAMES=['Exposure','Sensitivity','Adaptive capacity','FRI','Damage index','IFRI'].concat(HAS_SEIFA?['SEIFA IRSD decile']:[]);
const rows=S.filter(s=>s.ls&&s.ls.every(v=>v!=null)&&(!HAS_SEIFA||(s.seifa&&s.seifa[0]!=null)));const n=rows.length,k=NAMES.length;
const col=j=>rows.map(s=>j<6?s.ls[j]:s.seifa[0]);
const pearson=(a,b)=>{const ma=d3.mean(a),mb=d3.mean(b);let sab=0,saa=0,sbb=0;for(let i=0;i<a.length;i++){const x=a[i]-ma,y=b[i]-mb;sab+=x*y;saa+=x*x;sbb+=y*y;}return sab/Math.sqrt(saa*sbb);};
document.getElementById('f7sub').textContent=`${n.toLocaleString()} SA1s. Below the diagonal: each SA1 as a point. Diagonal: distribution. Above the diagonal: Pearson's r and the adjusted R² of a simple linear fit, 1 − (1 − r²)(n − 1)/(n − 2), shaded by r.${HAS_SEIFA?' The last row and column is the SEIFA 2021 IRSD decile (1 = most disadvantaged tenth of Australia); being ordinal, read its r as a trend, not a precise fit.':''}`;
const C=112,pad=34,Wm=pad+k*C,Hm=pad+k*C,dpr=window.devicePixelRatio||1;
const wrap=d3.select('#splomwrap').style('width',Wm+'px').style('height',Hm+'px');
const cv=wrap.append('canvas').attr('width',Wm*dpr).attr('height',Hm*dpr).style('width',Wm+'px').style('height',Hm+'px').style('position','absolute').node();
const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
const svg=wrap.append('svg').attr('id','splom').attr('width',Wm).attr('height',Hm).style('position','absolute');
const data=d3.range(k).map(col),sx=data.map(a=>d3.scaleLinear().domain(d3.extent(a)).nice().range([4,C-4]));
const sy=data.map(a=>d3.scaleLinear().domain(d3.extent(a)).nice().range([C-4,4]));
const rdiv=d3.scaleQuantize().domain([-1,1]).range(DIV);
for(let r=0;r<k;r++)for(let c=0;c<k;c++){
  const x0=pad+c*C,y0=pad+r*C;
  svg.append('rect').attr('x',x0+1).attr('y',y0+1).attr('width',C-2).attr('height',C-2).attr('fill','none').attr('stroke',css('--rule'));
  if(r>c){ctx.fillStyle=DARK?'rgba(134,182,239,.45)':'rgba(28,92,171,.35)';const a=data[c],b=data[r],rad=n>3000?1:1.8;
    for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(x0+sx[c](a[i]),y0+sy[r](b[i]),rad,0,6.283);ctx.fill();}}
  else if(r===c){const h=d3.bin().domain(sx[c].domain()).thresholds(18)(data[c]),my=d3.max(h,b=>b.length);
    h.forEach(b=>svg.append('rect').attr('x',x0+sx[c](b.x0)).attr('width',Math.max(0,sx[c](b.x1)-sx[c](b.x0)-1)).attr('y',y0+C-4-(C-12)*b.length/my).attr('height',(C-12)*b.length/my).attr('fill',css('--muted')).attr('opacity',.55));}
  else{const rv=pearson(data[r],data[c]),adj=1-(1-rv*rv)*(n-1)/(n-2);
    svg.append('rect').attr('x',x0+1).attr('y',y0+1).attr('width',C-2).attr('height',C-2).attr('fill',rdiv(rv)).attr('opacity',.85);
    const dark=Math.abs(rv)>.55;const tc=dark?'#fff':css('--ink');
    svg.append('text').attr('x',x0+C/2).attr('y',y0+C/2-4).attr('text-anchor','middle').attr('font-size',18).attr('font-weight',700).attr('fill',tc).text('r = '+rv.toFixed(2));
    svg.append('text').attr('x',x0+C/2).attr('y',y0+C/2+16).attr('text-anchor','middle').attr('font-size',11.5).attr('fill',tc).text('adj. R² '+adj.toFixed(2));}
}
NAMES.forEach((nm,j)=>{
  svg.append('text').attr('x',pad+j*C+C/2).attr('y',pad-10).attr('text-anchor','middle').attr('font-size',11.5).attr('font-weight',600).attr('fill',css('--ink')).text(nm);
  svg.append('text').attr('transform',`translate(${pad-10},${pad+j*C+C/2}) rotate(-90)`).attr('text-anchor','middle').attr('font-size',11.5).attr('font-weight',600).attr('fill',css('--ink')).text(nm);
});
window.__ready=true;
})();
</script>
</body>
</html>
