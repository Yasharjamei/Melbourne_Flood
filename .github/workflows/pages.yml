name: Build and deploy to GitHub Pages

# Work lands directly on main (no pull requests, no other branches). Every push to main:
# fetch -> build -> bundle -> screenshot check -> publish dist/ to GitHub Pages.
# If any step fails (including a page error in the screenshot check), nothing is deployed and
# the live site keeps its last good version.
# Needs Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # a newer push supersedes a build still running

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # first run downloads ~2 M address points; later runs hit the cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Raw inputs (Census DataPack ~100 MB, mesh blocks, overlays, DEM) are reused
      # until the fetch script or study-area config changes.
      - name: Cache raw inputs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-v2-${{ hashFiles('pipeline/01_fetch.py', 'pipeline/config.py') }}


      - name: Fetch, Greater Melbourne
        run: python pipeline/01_fetch.py --study metro
      - name: Build, Greater Melbourne
        run: python pipeline/02_build.py --study metro

      - name: Bundle pages
        run: |
          python pipeline/03_bundle.py
          touch dist/.nojekyll
          ls -la dist dist/metro

      # Open both pages in headless Chromium: a page error fails the run, so a broken page is
      # never deployed. The screenshots are attached to the run (Actions -> run -> Artifacts).
      - name: Screenshot check
        run: |
          pip install playwright && python -m playwright install --with-deps chromium
          python .github/scripts/screenshot.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
