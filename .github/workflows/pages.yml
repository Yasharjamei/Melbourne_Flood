name: Build and deploy to GitHub Pages

# Pull requests: fetch -> build -> bundle both pages, to prove the pipeline (no deploy).
# Pushes to main: the same, then publish dist/ to GitHub Pages.
# Needs Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets PR builds push screenshots to the ci-preview branch
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # first run downloads ~2 M address points; later runs hit the cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Raw inputs (Census DataPack ~100 MB, mesh blocks, overlays, DEM) are reused
      # until the fetch script or study-area config changes.
      - name: Cache raw inputs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-v2-${{ hashFiles('pipeline/01_fetch.py', 'pipeline/config.py') }}

      - name: Fetch, Maribyrnong + Moonee Valley
        run: python pipeline/01_fetch.py --study west
      - name: Build, Maribyrnong + Moonee Valley
        run: python pipeline/02_build.py --study west

      - name: Fetch, Greater Melbourne
        run: python pipeline/01_fetch.py --study metro
      - name: Build, Greater Melbourne
        run: python pipeline/02_build.py --study metro

      - name: Bundle pages
        run: |
          python pipeline/03_bundle.py
          touch dist/.nojekyll
          ls -la dist dist/metro

      # Pull requests only: screenshot both pages and publish them, with the built
      # pages, to the ci-preview branch so changes can be checked without deploying.
      - name: Preview screenshots
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          pip install playwright && python -m playwright install --with-deps chromium
          python .github/scripts/screenshot.py
          mkdir -p /tmp/preview && cp -r dist shots /tmp/preview/
          cd /tmp/preview && git init -q && git checkout -q -b ci-preview && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Preview of ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-preview

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
