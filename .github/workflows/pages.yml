name: Build and deploy to GitHub Pages

# Work lands directly on main (no pull requests, no other branches). Every push to main:
# fetch -> build -> bundle -> screenshot check -> publish dist/ to GitHub Pages -> clean up old runs.
# If any step fails (including a page error in the screenshot check), nothing is deployed and
# the live site keeps its last good version.
# Needs Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Monthly rebuild so upstream updates (planning overlay amendments, new addresses, flood
  # extents, roads, buildings) reach the site without a code change. 03:17 UTC on the 2nd.
  schedule:
    - cron: "17 3 2 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # a newer push supersedes a build still running

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # first run downloads ~2 M address points; later runs hit the cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Raw inputs (Census DataPack ~100 MB, mesh blocks, overlays, DEM) are reused
      # until the fetch script or study-area config changes, or the month turns.
      # The cache key includes the month, so the first run of each month downloads everything
      # afresh (the scheduled run above, normally); later runs that month reuse it.
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache raw inputs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-v2-${{ hashFiles('pipeline/01_fetch.py', 'pipeline/config.py') }}-${{ steps.month.outputs.month }}


      - name: Fetch, Greater Melbourne
        run: python pipeline/01_fetch.py --study metro
        env:   # scheduled refresh: any failed download stops the run; the live site keeps last month's build
          STRICT_FETCH: ${{ github.event_name == 'schedule' && '1' || '' }}
      - name: Build, Greater Melbourne
        run: python pipeline/02_build.py --study metro

      - name: Bundle pages
        run: |
          python pipeline/03_bundle.py
          touch dist/.nojekyll
          ls -la dist dist/metro

      # Open both pages in headless Chromium: a page error fails the run, so a broken page is
      # never deployed. The screenshots are attached to the run (Actions -> run -> Artifacts).
      - name: Screenshot check
        run: |
          pip install playwright && python -m playwright install --with-deps chromium
          python .github/scripts/screenshot.py

      # Recompute the A/B circle counts independently (haversine, in Python) and compare with the
      # page's own maths, plus a real mouse drag and click. Any mismatch fails the run.
      - name: Circle check
        run: python .github/scripts/check_circles.py metro

      # A captioned ~20 s demo of the real map (shots/demo.gif and demo.mp4, in the screenshots
      # artifact) for sharing. Never blocks a deploy.
      - name: Demo recording
        continue-on-error: true
        run: |
          pip install pillow
          python .github/scripts/demo_gif.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 14   # the clean-up job deletes older runs anyway

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Only the newest site is ever live; this removes the history that piles up behind it.
  # Runs only after a successful deploy, so a failed build never deletes the last good record.
  # A clean-up error is logged as a warning and never fails the run: the site is already live.
  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write        # delete old workflow runs (and their logs and artifacts)
      deployments: write    # delete old github-pages deployment records
    env:
      KEEP_RUNS: 5          # newest completed runs to keep, for their logs; 1 = only the latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo, keep = Number(process.env.KEEP_RUNS);
            const newest = (a, b) => new Date(b.created_at) - new Date(a.created_at);
            const tryDo = async (what, f) => { try { await f(); return 1; } catch (e) { core.warning(`${what}: ${e.message}`); return 0; } };

            // 1. Deployment records: keep only the one just made (the live site).
            const deps = (await github.paginate(github.rest.repos.listDeployments,
              {owner, repo, environment: 'github-pages', per_page: 100})).sort(newest);
            let nd = 0;
            for (const d of deps.slice(1)) nd += await tryDo(`deployment ${d.id}`, async () => {
              await github.rest.repos.createDeploymentStatus({owner, repo, deployment_id: d.id, state: 'inactive'});
              await github.rest.repos.deleteDeployment({owner, repo, deployment_id: d.id});
            });

            // 2. Workflow runs of this workflow: keep the newest KEEP_RUNS completed ones.
            // This run is still in progress, so it is never in the list.
            const runs = (await github.paginate(github.rest.actions.listWorkflowRuns,
              {owner, repo, workflow_id: 'pages.yml', status: 'completed', per_page: 100})).sort(newest);
            let nr = 0;
            for (const r of runs.slice(Math.max(keep - 1, 0)))
              nr += await tryDo(`run ${r.id}`, () => github.rest.actions.deleteWorkflowRun({owner, repo, run_id: r.id}));

            core.info(`kept 1 of ${deps.length} deployments (deleted ${nd}); deleted ${nr} of ${runs.length} older runs`);

