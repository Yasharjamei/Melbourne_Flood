name: Probe data sources

# Manual only, never deploys: lists and reads open sources for further forecast checks
# (pipeline/forecast/probe_sources.py). Nothing is kept.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u pipeline/forecast/probe_sources.py
