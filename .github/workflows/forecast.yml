name: Forecast back-test

# Manual only, and never deploys. Development of the population forecast (scenarios page):
# downloads the forecast inputs and runs the 2016 -> 2021 placement back-test, then attaches the
# report. Reuses the main build's raw-data cache (mesh blocks, 2021 counts) without changing it.
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Record the 3D column video (about 23 minutes)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - id: month
        run: echo "m=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore the main build's raw inputs (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-v2-${{ hashFiles('pipeline/01_fetch.py', 'pipeline/config.py') }}-none
          restore-keys: raw-v2-
      - name: Main inputs the forecast needs (own cache, refreshed monthly like the site's)
        uses: actions/cache@v4
        with:
          path: |
            data/raw/metro/lga.geojson
            data/raw/metro/mb.geojson
            data/raw/metro/flood.geojson
            data/raw/metro/addr.npy
            data/raw/metro/sa1.geojson
            data/raw/metro/sal.geojson
            data/raw/shared/mb_counts_2021.xlsx
            data/raw/gcp/2021Census_G36_VIC_SA1.csv
            data/raw/shared/aep1.geojson
            data/raw/metro/flood_oct2022.geojson
            data/raw/forecast/aep100.geojson
            data/raw/forecast/flood_history.geojson
          key: forecast-main-v6-${{ steps.month.outputs.m }}
          restore-keys: forecast-main-v5-${{ steps.month.outputs.m }}   # reuse last cache; only the new files are fetched
      - name: Forecast inputs cache
        uses: actions/cache@v4
        with:
          path: data/raw/forecast
          key: forecast-v1-${{ hashFiles('pipeline/forecast/fetch.py') }}

      - name: Main inputs, only those missing
        run: python pipeline/forecast/fetch.py --main
        env:
          STRICT_FETCH: "1"
      - name: Forecast inputs
        run: python pipeline/forecast/fetch.py
        env:
          STRICT_FETCH: "1"
      - name: Back-test 2016 -> 2021
        run: |
          set -o pipefail   # without this, tee hides a failing back-test and the run shows green
          python pipeline/forecast/backtest.py | tee backtest.txt
      - name: Ensemble back-test (council -> SA2) and VIF2023 check
        run: |
          set -o pipefail
          python pipeline/forecast/ensemble.py | tee ensemble.txt
      - name: UDP back-test (2017 and 2018 editions, CC BY)
        continue-on-error: true      # reports only
        run: python -u pipeline/forecast/udp_backtest.py | tee udp_backtest.txt
      - name: Forecast to 2036 and residents in flood areas
        run: |
          set -o pipefail
          python pipeline/forecast/forecast.py | tee forecast.txt
          python pipeline/forecast/preview.py
      - name: Checks on the flood count (2016 -> 2021 back-test; ground-level residents)
        continue-on-error: true      # reports only
        run: python -u pipeline/forecast/floodtest.py | tee floodtest.txt
      - name: Flood areas against the October 2022 flood and past recorded floods (observed)
        continue-on-error: true      # reports only
        run: python -u pipeline/forecast/floodval.py | tee floodval.txt
      - name: Compare with the City of Melbourne's own small-area forecasts
        continue-on-error: true      # reports only
        run: python -u pipeline/forecast/com_compare.py | tee com_compare.txt
      - name: Browser
        run: pip install playwright pillow imageio-ffmpeg && python -m playwright install --with-deps chromium
      - name: Check the scenarios page in desktop and phone browsers (screenshots in the log)
        continue-on-error: true      # reports only
        timeout-minutes: 15
        run: python -u .github/scripts/check_scenarios.py
      - name: 3D column animation for sharing (shots/columns.mp4, .gif)
        if: ${{ inputs.video }}
        continue-on-error: true      # a recording problem never hides the forecast results
        timeout-minutes: 25
        run: python -u .github/scripts/record_columns.py
      - run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat backtest.txt ensemble.txt udp_backtest.txt forecast.txt floodtest.txt floodval.txt com_compare.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-backtest
          path: |
            backtest.txt
            ensemble.txt
            data/processed/forecast_backtest.json
            data/processed/forecast_ensemble.json
            forecast.txt
            floodtest.txt
            data/processed/forecast_floodtest.json
            com_compare.txt
            floodval.txt
            data/processed/forecast_floodval.json
            udp_backtest.txt
            data/processed/forecast_udp_backtest.json
            data/processed/forecast_com.json
            data/processed/scenarios.json
            preview/
            data/processed/scenarios_sa1.js
            shots/columns.mp4
            shots/columns.gif
          retention-days: 30
